setTimeout(()=>{const o={no:"VT-"+(10483+S.orders.length),pm:pm,total:sub()+ship(),name:S.ship.n};S.orders.push(o);S.last=o;S.cart=[];save();upd();go("done")},1100)}
function drawer(){const d=$("#dw");d.innerHTML='<div class="dh"><h3>السلة ('+cnt()+')</h3><button class="x" style="position:static" id="dx" type="button" aria-label="إغلاق">&times;</button></div><div class="db">'+(S.cart.length?S.cart.map(x=>{const p=P.find(q=>q.id===x.id);return '<div class="ci"><div class="th" style="background:'+BG[p.c]+'">'+art(p.c,COL[p.id])+'</div><div><b>'+p.n+'</b><small>'+money(p.p)+'</small><div class="qty" style="margin-top:4px"><button data-m="'+p.id+'" type="button" aria-label="أقل">−</button><span>'+x.q+'</span><button data-p="'+p.id+'" type="button" aria-label="أكتر">+</button></div></div><div class="ri"><b>'+money(p.p*x.q)+'</b><br><button data-d="'+p.id+'" type="button" style="border:0;background:none;color:var(--rd);font-weight:700;font-size:13px">حذف</button></div></div>'}).join(""):'<div class="em">السلة فاضية</div>')+'</div><div class="df"><div class="row"><span>المجموع</span><span>'+money(sub())+'</span></div><div class="row"><span>الشحن</span><span>'+(ship()?money(ship()):"مجاني")+'</span></div><button class="btn w" id="dco" type="button" style="margin-top:10px" '+(S.cart.length?"":"disabled")+'>كمّل الطلب</button></div>';
$("#dx").addEventListener("click",()=>d.classList.remove("on"));
$("#dco").addEventListener("click",()=>{d.classList.remove("on");go("checkout")});
d.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{const i=S.cart.find(x=>x.id==b.dataset.m);i.q--;if(i.q<1)S.cart=S.cart.filter(x=>x!==i);save();upd();drawer()}));
d.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{S.cart.find(x=>x.id==b.dataset.p).q++;save();upd();drawer()}));
d.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{S.cart=S.cart.filter(x=>x.id!=b.dataset.d);save();upd();drawer()}))}
function modal(id){const p=P.find(x=>x.id===id),o=$("#ov");let q=1;
o.innerHTML='<div class="md" role="dialog" aria-modal="true" aria-label="'+p.n+'"><button class="x" id="mx2" type="button" aria-label="إغلاق">&times;</button><div class="mi" style="background:'+BG[p.c]+'">'+art(p.c,COL[p.id])+'</div><div class="mt"><small style="color:var(--mt);font-weight:700">'+p.b+' · '+C[p.c]+'</small><h2>'+p.n+'</h2><div class="st">'+stars(p.r)+'<span>('+p.rv+' تقييم تجريبي)</span></div><div class="pp">'+money(p.p)+(p.o?' <s style="font-size:16px;color:var(--mt);font-weight:600">'+money(p.o)+'</s>':'')+'</div><ul>'+p.d.map(x=>'<li>'+x+'</li>').join("")+'</ul><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="qty"><button id="qm" type="button" aria-label="أقل">−</button><span id="qv">1</span><button id="qp" type="button" aria-label="أكتر">+</button></div><button class="btn" id="mad" type="button">أضف للسلة</button></div></div></div>';
o.classList.add("on");const cl=()=>o.classList.remove("on");
$("#mx2").addEventListener("click",cl);o.addEventListener("click",e=>{if(e.target===o)cl()},{once:true});
$("#qm").addEventListener("click",()=>{q=Math.max(1,q-1);$("#qv").textContent=q});$("#qp").addEventListener("click",()=>{q=Math.min(9,q+1);$("#qv").textContent=q});
$("#mad").addEventListener("click",()=>{add(id,q);cl()})}
R.addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(a){add(+a.dataset.a);return}const o=e.target.closest("[data-o]");if(o)modal(+o.dataset.o)});
$("#bCt").addEventListener("click",()=>{drawer();$("#dw").classList.add("on")});
$("#bAc").addEventListener("click",()=>go("account"));$("#bAd").addEventListener("click",()=>go("admin"));$("#lgo").addEventListener("click",()=>go("shop"));
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(S.v!=="shop"){S.v="shop";render()}else grid()});
addEventListener("keydown",e=>{if(e.key==="Escape"){$("#ov").classList.remove("on");$("#dw").classList.remove("on")}});
if(/static/.test(location.search)){const m=location.search.match(/v=(\w+)/);if(m){if(m[1]==="pay"||m[1]==="done"||m[1]==="checkout"){S.cart=[{id:1,q:1},{id:3,q:1}];S.ship={n:"كريم",p:"01000000000",a:"عنوان تجريبي"}}if(m[1]==="done")S.last={no:"VT-10483",pm:"كارت بنكي (تجريبي)",total:17060};S.v=m[1]}}
upd();render()})()</script></body></html>
